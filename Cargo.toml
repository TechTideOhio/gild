[package]
name = "gild"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "TideOS Eval Kit (Tool 2): Golden dataset authoring, stratification, and versioning"
license = "MIT"
repository = "https://github.com/TechTideOhio/gild"
keywords = ["evals", "golden-dataset", "ai-agents", "reproducibility", "stratification"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = [
    "std", "help", "usage", "error-context", "suggestions", "derive",
] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
rstest = "0.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
